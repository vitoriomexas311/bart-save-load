[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bart-persistence"
version = "0.1.0"
description = "Save and reload scalar PyMC BART posterior trees"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
current = ["pymc-bart==0.13.1", "pymc==6.3.2", "bartrs==0.4.0"]
legacy = ["pymc-bart==0.11.0", "pymc==5.25.1"]
test = ["pytest>=8", "pytest-cov>=5", "build"]
notebook = ["jupyterlab", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
include = ["bart_persistence*"]

[tool.pytest.ini_options]
addopts = "--cov=bart_persistence --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
source = ["bart_persistence"]
branch = true
