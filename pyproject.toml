[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bart-persistence"
version = "0.1.0"
description = "Save and reload scalar PyMC BART posterior trees"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy"]
keywords = ["bart", "pymc", "bayesian", "serialization", "prediction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/vitoriomexas311/bart-save-load"
Documentation = "https://github.com/vitoriomexas311/bart-save-load/blob/main/docs/reference.md"
Issues = "https://github.com/vitoriomexas311/bart-save-load/issues"
Changelog = "https://github.com/vitoriomexas311/bart-save-load/blob/main/CHANGELOG.md"

[project.optional-dependencies]
current = ["pymc-bart==0.13.1", "pymc==6.3.2", "bartrs==0.4.0"]
legacy = ["pymc-bart==0.11.0", "pymc==5.25.1"]
test = ["pytest>=8", "pytest-cov>=5", "build"]
notebook = ["jupyterlab", "nbconvert", "ipykernel"]
dev = ["ruff>=0.11", "twine>=6"]

[tool.setuptools.packages.find]
include = ["bart_persistence*"]

[tool.pytest.ini_options]
addopts = "--cov=bart_persistence --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
source = ["bart_persistence"]
branch = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.paths]
package = ["bart_persistence", "*/bart_persistence"]
