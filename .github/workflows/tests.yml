name: BART save and load

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: persistence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.stack }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {stack: legacy, python: '3.11'}
          - {stack: current, python: '3.13'}
    env:
      COVERAGE_FILE: .coverage.${{ matrix.stack }}
      PYTENSOR_FLAGS: base_compiledir=/tmp/pytensor-${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the supported stack and development tools
        run: python -m pip install -e '.[${{ matrix.stack }},test,notebook]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test persistence and measure statement and branch coverage
        run: python -m pytest
      - name: Save coverage for the combined gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.stack }}
          path: .coverage.${{ matrix.stack }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Build and install the wheel instead of the editable package
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m ipykernel install --sys-prefix --name bart-persistence
      - name: Execute the notebook outside the checkout against the installed wheel
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          import bart_persistence.load as module

          assert Path(module.__file__).is_relative_to(sys.prefix), module.__file__
          root = Path(os.environ['GITHUB_WORKSPACE'])
          with tempfile.TemporaryDirectory() as work:
              notebook = Path(work) / 'bart_persistence_walkthrough.ipynb'
              shutil.copy2(root / notebook.name, notebook)
              subprocess.run([
                  sys.executable, '-m', 'nbconvert', '--to', 'notebook', '--execute',
                  str(notebook), '--ExecutePreprocessor.kernel_name=bart-persistence',
                  '--ExecutePreprocessor.timeout=300', '--output-dir', str(root / 'artifacts'),
              ], cwd=work, check=True, timeout=600)
      - name: Preserve the executed walkthrough and installable wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.stack }}
          path: |
            artifacts/*.ipynb
            dist/*
          if-no-files-found: error

  coverage:
    name: 100% statement and branch coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'coverage>=7'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine both implementations and enforce complete coverage
        run: |
          python -m coverage combine
          python -m coverage report --fail-under=100

  quality:
    name: Lint and distribution metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m ruff check bart_persistence tests
      - run: python -m build
      - run: python -m twine check --strict dist/*
