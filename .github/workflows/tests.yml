name: Persistence tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tests only read repository code; they never write to the repository or use secrets.
permissions:
  contents: read

jobs:
  round-trip:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux-Py311-BART011, os: ubuntu-latest, python: '3.11', lock: requirements-py311.lock.txt}
          - {name: Linux-Py313-BART011, os: ubuntu-latest, python: '3.13', lock: requirements-py313.lock.txt}
          - {name: Linux-Py313-BART013, os: ubuntu-latest, python: '3.13', lock: requirements-current.lock.txt}
          - {name: macOS-Py313-BART013, os: macos-14, python: '3.13', lock: requirements-current.lock.txt}
          - {name: Windows-Py311-BART011, os: windows-latest, python: '3.11', lock: requirements-py311.lock.txt}
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Install the exact tested dependency set
        run: python -m pip install -r ${{ matrix.lock }}
      - name: Check package compatibility
        run: python -m pip check
      - name: Unit tests and real process-boundary tests
        run: python -m unittest discover -s tests -v
      - name: Preserve generated evidence, including failed-run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.name }}
          path: .test-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
